name: Build and Publish Tripal Docker image
on:
  # Allows us to manually trigger this workflow.
  # This is great if there is a change made to Tripal core that we want to test our modules on ASAP.
  workflow_dispatch:
  # Allows us to schedule when this workflow is run.
  # This ensures we pick up any new changes committed to Tripal Core.
  schedule:
    # Run at 1am every night.
    - cron: '0 1 * * *'

jobs:
  push_to_registry:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        pgsql-version:
          - "13"
          - "14"
          - "15"
          - "16"
          - "17"
        drupal-version:
          - "10.5.x-dev"
          - "10.6.x-dev"
          - "11.x-dev"
          - "11.2.x-dev"
          - "11.3.x-dev"
        exclude:
          ## TripalDocker removed support for PHP 8.1.
          - php-version: "8.1"
            drupal-version: "10.6.x-dev"
          ## Only Drupal 11.x supports PHP 8.4.
          - php-version: '8.4'
            drupal-version: '10.5.x-dev'
          - php-version: '8.4'
            drupal-version: '10.6.x-dev'
          ## Only Drupal 11.3+ supports PHP 8.5.
          - php-version: '8.5'
            drupal-version: '10.5.x-dev'
          - php-version: '8.5'
            drupal-version: '10.6.x-dev'
          - php-version: '8.5'
            drupal-version: '11.2.x-dev'
          ## Drupal 11.x requires PHP 8.3+.
          - php-version: "8.1"
            drupal-version: "11.x-dev"
          - php-version: "8.2"
            drupal-version: "11.x-dev"
          - php-version: "8.1"
            drupal-version: "11.2.x-dev"
          - php-version: "8.2"
            drupal-version: "11.2.x-dev"
          - php-version: "8.1"
            drupal-version: "11.3.x-dev"
          - php-version: "8.2"
            drupal-version: "11.3.x-dev"
          # Drupal 11+ requires at least Postgresql 16.
          - pgsql-version: "13"
            drupal-version: "11.x-dev"
          - pgsql-version: "14"
            drupal-version: "11.x-dev"
          - pgsql-version: "15"
            drupal-version: "11.x-dev"
          - pgsql-version: "13"
            drupal-version: "11.2.x-dev"
          - pgsql-version: "14"
            drupal-version: "11.2.x-dev"
          - pgsql-version: "15"
            drupal-version: "11.2.x-dev"
          - pgsql-version: "13"
            drupal-version: "11.3.x-dev"
          - pgsql-version: "14"
            drupal-version: "11.3.x-dev"
          - pgsql-version: "15"
            drupal-version: "11.3.x-dev"
    name: Tripal ${{ matrix.drupal-version }}-php${{ matrix.php-version }}-pgsql${{ matrix.pgsql-version }}
    steps:
      - uses: actions/checkout@v4
        name: Check out code
      - uses: mr-smithers-excellent/docker-build-push@v6.3
        name: Build & push Full matrix of Docker images
        with:
          image: knowpulse/tripalcultivate-tripal
          tags: drupal${{ matrix.drupal-version }}-php${{ matrix.php-version }}-pgsql${{ matrix.pgsql-version }}
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          dockerfile: tripal.Dockerfile
          buildArgs: "drupalversion=${{ matrix.drupal-version }},phpversion=${{ matrix.php-version }},pgsqlversion=${{ matrix.pgsql-version }}"
          labels: 'drupal.version.label="${{ matrix.drupal-version }}", php.version.label="${{ matrix.php-version }}", postgresql.version.label="${{ matrix.pgsql-version }}", tripal.version="4.x", theme="TripalCultivateTheme"'
      - uses: mr-smithers-excellent/docker-build-push@v6.3
        name: Build & push Full matrix of Docker images WITHOUT THEME
        with:
          image: knowpulse/tripalcultivate-tripal
          tags: notheme-drupal${{ matrix.drupal-version }}-php${{ matrix.php-version }}-pgsql${{ matrix.pgsql-version }}
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          dockerfile: tripal.Dockerfile
          buildArgs: "drupalversion=${{ matrix.drupal-version }},phpversion=${{ matrix.php-version }},pgsqlversion=${{ matrix.pgsql-version }},installTheme=FALSE"
          labels: 'drupal.version.label="${{ matrix.drupal-version }}",php.version.label="${{ matrix.php-version }}", postgresql.version.label="${{ matrix.pgsql-version }}", tripal.version="4.x", theme="Olivero"'
      - uses: mr-smithers-excellent/docker-build-push@v6.3
        name: Build latest using 11.3.x-dev, PHP 8.5, PgSQL 17
        if: ${{ matrix.drupal-version == '11.3.x-dev' && matrix.php-version == '8.5' && matrix.pgsql-version == '17' }}
        with:
          image: knowpulse/tripalcultivate-tripal
          tags: latest
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          dockerfile: tripal.Dockerfile
          buildArgs: "drupalversion=${{ matrix.drupal-version }},phpversion=${{ matrix.php-version }},pgsqlversion=${{ matrix.pgsql-version }}"
          labels: 'drupal.version.label="${{ matrix.drupal-version }}",php.version.label="${{ matrix.php-version }}", postgresql.version.label="${{ matrix.pgsql-version }}", tripal.version="4.x", theme="TripalCultivateTheme"'


name: 'PHPUnit'

on:
  workflow_dispatch:
  push:
    branches:
      - 4.x
  schedule:
    - cron: '0 6 * * *'

permissions: read-all


jobs:
  running-tests:
    name: 'PHP 8.2 - Drupal 10.6.x-dev - PostgreSQL 17'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v6'
      - name: 'Run Automated testing'
        uses: 'tripal/test-tripal-action@v1.8'
        with:
          directory-name: 'trpcultivate_germplasm'
          modules: 'trpcultivate_germplasm, trpcultivate_germcollection'
          php-version: '8.2'
          drupal-version: '10.6.x-dev'
          pgsql-version: '17'
          build-image: TRUE
          dockerfile: 'Dockerfile'

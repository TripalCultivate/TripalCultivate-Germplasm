
name: 'PHPUnit'

on:
  workflow_dispatch:
  push:
    branches:
      - 4.x
      - g5.45-updateTestingGrid
  schedule:
    # Run at 2am every night.
    - cron: '0 2 * * *'

permissions: read-all


jobs:
  running-tests:
    name: 'PHP 8.3 - Drupal 10.5.x - PostgreSQL 18'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v6'
      - name: 'Run Automated testing'
        uses: 'tripal/test-tripal-action@v1.8'
        with:
          directory-name: 'trpcultivate_germplasm'
          modules: 'trpcultivate_germplasm, trpcultivate_germcollection'
          php-version: '8.3'
          drupal-version: '10.5.x'
          pgsql-version: '18'
          build-image: TRUE
          dockerfile: 'Dockerfile'
